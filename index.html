  <style>
    html {
      font-family: 'Press Start 2P', monospace;
      background: black;
    }

    /* Pixel rendering */
    img {
      image-rendering: pixelated;
    }

    /* Retro blink animation (choppy) */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .blink {
      animation: blink 1s steps(2, start) infinite;
    }

    /* Scanline overlay */
    .scanlines::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(6, 2, 24, 0.05),
        rgba(0,255,0,0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
